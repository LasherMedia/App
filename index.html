<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Lasher Media</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07080B">
<link rel="manifest" href="manifest.webmanifest">

<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
:root{--bg:#07080B;--card:#12141a;--line:#23262f;--red:#ff0000;--tx:#fff;--mu:#9aa0ad;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--tx);--font:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-family:var(--font)}
.app{max-width:440px;margin:0 auto;min-height:100vh;padding:28px 22px 24px;display:flex;flex-direction:column;align-items:center;gap:20px;background:radial-gradient(ellipse at 85% 0,#451018 0,transparent 55%),repeating-linear-gradient(115deg,transparent 0 60px,rgba(255,255,255,.025) 60px 61px),var(--bg)}
.wm{width:86%;max-width:340px;filter:drop-shadow(0 6px 18px rgba(255,0,0,.25))}
.tag{letter-spacing:.28em;font-size:13px;color:var(--mu);text-transform:uppercase;margin:0}
.cta{font-size:34px;font-weight:800;letter-spacing:-.03em;line-height:1.05;text-align:center;margin:0}
.cta span{color:var(--red)}
.qrwrap{position:relative;background:#fff;padding:16px;border:5px solid #000;box-shadow:8px 8px 0 var(--red);clip-path:polygon(0 0,100% 0,100% calc(100% - 22px),calc(100% - 22px) 100%,0 100%)}
#qr{display:block;width:260px;height:260px}
.hat{position:absolute;left:50%;top:50%;width:25%;transform:translate(-50%,-50%);background:#fff;padding:5px;border-radius:6px}
.btn{position:relative;overflow:hidden;display:block;width:100%;text-align:center;text-decoration:none;color:#fff;background:linear-gradient(180deg,#ff2a2a,#d90000);font-weight:700;letter-spacing:.01em;font-size:19px;padding:16px;border:2px solid rgba(255,255,255,.35);border-radius:999px;box-shadow:0 0 16px rgba(255,0,0,.55),0 0 40px rgba(255,0,0,.3);animation:pulse 2.4s ease-in-out infinite;transition:transform .25s ease,box-shadow .25s ease}
.btn::after{content:"";position:absolute;top:0;left:-70%;width:45%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-20deg);transition:left .6s ease}
.btn:hover,.btn:focus-visible{transform:translateY(-4px) scale(1.04);box-shadow:0 0 26px rgba(255,40,40,.95),0 0 70px rgba(255,0,0,.55);animation:none;outline:none}
.btn:hover::after,.btn:focus-visible::after{left:130%}
.btn:active{transform:translateY(0) scale(.97)}
@keyframes pulse{0%,100%{box-shadow:0 0 14px rgba(255,0,0,.5),0 0 34px rgba(255,0,0,.25)}50%{box-shadow:0 0 24px rgba(255,0,0,.85),0 0 56px rgba(255,0,0,.45)}}
@media(prefers-reduced-motion:reduce){.btn,.btn::after{animation:none;transition:none}}
.btn b{position:relative;z-index:1}
.url{color:var(--mu);font-size:15px;letter-spacing:.12em;margin:0}
.foot{margin-top:auto;font-size:11px;color:#5b616e;letter-spacing:.2em;text-transform:uppercase}
</style></head><body><main class="app">
